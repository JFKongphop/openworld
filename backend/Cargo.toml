[package]
name = "openworld"
version = "0.1.0"
edition = "2021"
authors = ["OpenWorld Team"]
description = "Autonomous agentic travel planning and reservation system powered by Qwen (Alibaba Cloud Model Studio)"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/api.rs"

[[bin]]
name = "travel"
path = "src/bin/travel.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "oss_test"
path = "src/bin/oss_test.rs"

[[bin]]
name = "oss_fetch"
path = "src/bin/oss_fetch.rs"

[dependencies]
tokio          = { version = "1",    features = ["full"] }
reqwest        = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"
serde_yaml     = "0.9"
dotenv         = "0.15"
chrono         = { version = "0.4",  features = ["clock"] }
anyhow         = "1"
regex          = "1"
axum           = { version = "0.7",  features = ["macros", "ws"] }
tower-http     = { version = "0.5",  features = ["cors"] }
async-trait    = "0.1"
futures        = "0.3"
uuid           = { version = "1",    features = ["v4", "serde"] }
tokio-stream   = "0.1"
md5            = "0.7"
hmac           = "0.12"
sha2           = "0.10"
hex            = "0.4"
urlencoding    = "2"
sha1           = "0.10"
base64         = "0.21"
